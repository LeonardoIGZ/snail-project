services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: snailbet
      POSTGRES_PASSWORD: snailbet
      POSTGRES_DB: snailbet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snailbet -d snailbet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: